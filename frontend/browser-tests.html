<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>史脉浏览器回归测试</title>
<h1>浏览器回归测试（仅使用模拟接口与隔离存储）</h1>
<pre id="results">运行中</pre>
<script type="module">
const sources = await Promise.all(['data.js', 'territory-map.js', 'app.js'].map(p => fetch(p, {cache: 'no-store'}).then(r => r.text())));
const results = [];
const assert = (value, message) => { if (!value) throw new Error(message); };
const tick = () => new Promise(resolve => setTimeout(resolve, 30));
const response = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: {'Content-Type':'application/json'} });
const fixtures = Array.from({length:10}, (_, i) => ({id:'test'+i, dim:i<4?'timeline':i<7?'person':'institution',stem:'测试问题 '+i,options:['甲','乙','丙','丁'],answer:0,explain:'解析',source:'测试资料',sourceId:'zhangjuzheng/c4'}));
async function setup(page, options = {}) {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:100%;height:180px';
  document.body.append(frame);
  const w = frame.contentWindow;
  const d = w.document;
  d.open(); d.write('<!doctype html><html><head><meta name="api-base" content="http://localhost:8000"></head><body data-page="'+page+'"><div id="app"></div></body></html>'); d.close();
  const store = new Map();
  Object.defineProperty(w, 'localStorage', {value: {getItem:k=>store.get(k)||null,setItem:(k,v)=>{
    if (options.failProgressWrites && k === 'shimais-daming:progress:v1') throw new Error('quota');
    store.set(k,v);
  },removeItem:k=>store.delete(k)}});
  const requests = [];
  const timeouts = [];
  const nativeTimeout = w.setTimeout.bind(w);
  w.setTimeout = (fn, ms, ...args) => { if (ms >= 10000) { timeouts.push({fn,ms}); return -timeouts.length; } return nativeTimeout(fn, ms, ...args); };
  w.fetch = (url, init={}) => {
    if (String(url).endsWith('/api/health')) return Promise.resolve(response({status:'ok'}));
    return new Promise((resolve,reject) => {
      const req = {url,init,resolve:body=>resolve(response(body)),fail:(body,status)=>resolve(response(body,status)),raw:(text,status,headers={})=>resolve(new Response(text,{status,headers})),reject};
      requests.push(req);
      if (!options.ignoreAbort) init.signal?.addEventListener('abort',()=>reject(new DOMException('Cancelled','AbortError')));
    });
  };
  if (options.offline) d.querySelector('meta').content = 'offline';
  if (options.search) {
    const NativeUPS = w.URLSearchParams;
    w.URLSearchParams = class extends NativeUPS {
      constructor(init) { super((init === undefined || init === '') ? options.search : init); }
    };
  }
  if (options.progress) store.set('shimais-daming:progress:v1', JSON.stringify(options.progress));
  if (options.chatMem) store.set('shimais-daming:chatmem:v1', JSON.stringify(options.chatMem));
  for (let i=0;i<sources.length;i++) { const script=d.createElement('script'); script.textContent=sources[i]+(i===0?'\nwindow.fixtureData=SITE_DATA;':''); d.body.append(script); }
  await tick();
  return {w,d,frame,requests,store,timeouts,close:()=>frame.remove()};
}
async function test(name, fn) {
  try { await fn(); results.push({name,pass:true}); }
  catch (e) { results.push({name,pass:false,error:e.message}); }
  document.querySelector('#results').textContent = results.map(r=>(r.pass?'PASS ':'FAIL ')+r.name+(r.error?' : '+r.error:'')).join('\n');
}
await test('T03/T05 同人物快速点击、Enter、推荐问题只请求一次',async()=>{
  const t=await setup('chat');
  try {
    const input=t.d.querySelector('textarea'); input.value='第一问';
    t.d.querySelector('.ct-send').click(); input.value='第二问';
    input.dispatchEvent(new t.w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
    t.d.querySelector('.ct-chip').click();
    assert(t.requests.length===1,'同会话发出了 '+t.requests.length+' 个并行请求');
    assert(t.d.querySelector('.ct-send').disabled,'发送按钮未禁用');
    t.requests[0].resolve({reply:'第一答'}); await tick();
    assert(!t.d.querySelector('.ct-send').disabled,'响应后未解锁');
  } finally {t.close();}
});
await test('T01/T02 切换人物后回复与离线回退归属原会话',async()=>{
  const t=await setup('chat');
  try {
    t.d.querySelector('.ct-chip').click();
    t.d.querySelectorAll('.ct-picker button')[1].click();
    t.d.querySelector('.ct-chip').click();
    assert(t.requests.length===2,'不同人物请求不独立');
    t.requests[1].resolve({reply:'朱棣回答'}); await tick();
    t.requests[0].reject(new TypeError('network')); await tick();
    assert(t.d.querySelector('.ct-flow').textContent.includes('朱棣回答'),'新人物回答丢失');
    assert(!t.d.querySelector('.ct-offline').checkVisibility(),'旧人物错误污染当前提示');
    t.d.querySelectorAll('.ct-picker button')[0].click();
    assert(!t.d.querySelector('.ct-flow').textContent.includes('朱棣回答'),'跨人物串台');
    assert(t.d.querySelectorAll('.ct-flow .ct-msg').length===2,'原人物回退缺失');
  } finally {t.close();}
});

});
await test('BT-4 等待中点忘记，中止请求且晚到回复与记忆不得复活',async()=>{
 const t=await setup('chat',{ignoreAbort:true});
 try {
  t.w.confirm=()=>true;
  const input=t.d.querySelector('textarea');input.value='已记住的问题';t.d.querySelector('.ct-send').click();
  t.requests[0].resolve({reply:'第一答'});await tick();
  const forget=t.d.querySelector('.ct-forget-btn');assert(forget.checkVisibility(),'已有记忆时忘记按钮不可见');
  input.value='待忘记的问题';t.d.querySelector('.ct-send').click();
  forget.click();
  assert(t.requests[1].init.signal.aborted,'忘记没有中止在途请求');
  assert(t.d.querySelectorAll('.ct-flow .ct-msg').length===0,'忘记后仍残留消息或等待节点');
  assert(!t.d.querySelector('.ct-send').disabled,'忘记后无法开始新对话');
  input.value='忘记后的新问题';t.d.querySelector('.ct-send').click();
  t.requests[1].resolve({reply:'晚到回答'});await tick();
  assert(!t.d.querySelector('.ct-flow').textContent.includes('晚到回答'),'晚到回复写入已忘记会话');
  assert(!JSON.parse(t.store.get('shimais-daming:chatmem:v1')).zhuyuanzhang,'晚到回复复活记忆');
  assert(t.d.querySelector('.ct-send').disabled && t.d.querySelector('.ct-pending'),'旧请求收尾清掉了新请求等待态');
  t.requests[2].resolve({reply:'新回答'});await tick();
  const mem=JSON.parse(t.store.get('shimais-daming:chatmem:v1')).zhuyuanzhang;
  assert(mem && mem.history.length===2,'新对话记忆未正常建立');
  assert(!mem.history.some(m=>m.content.includes('待忘记')||m.content.includes('晚到回答')),'旧请求污染新记忆');
 }finally{t.close();}
});
await test('BT-5 聊天话题落库与发送前均移除换行和控制字符',async()=>{
 const t=await setup('chat',{chatMem:{zhuyuanzhang:{history:[],totalRounds:1,lastTopics:['旧\n话题','\u0000'],lastVisit:0}}});
 try {
  const input=t.d.querySelector('textarea');input.value='新\n\t话题';t.d.querySelector('.ct-send').click();
  const payload=JSON.parse(t.requests[0].init.body);
  assert(JSON.stringify(payload.memory.lastTopics)==='["旧话题"]','发送的 memory 话题未消毒');
  t.requests[0].resolve({reply:'回答'});await tick();
  const mem=JSON.parse(t.store.get('shimais-daming:chatmem:v1')).zhuyuanzhang;
  assert(JSON.stringify(mem.lastTopics)==='["旧话题","新话题"]','落库话题未消毒或丢失正常话题');
  assert(!/[\u0000-\u001f\u007f-\u009f\u2028\u2029]/.test(mem.lastTopics.join('')),'落库仍含控制字符');
 }finally{t.close();}
});

      assert(t.store.get('shimais-daming:progress:v1') === JSON.stringify({ research }), '只读渲染改写了损坏数据');
    } finally { t.close(); }
  }
});

await test('研读线索：首页仅在进行中线索下增加继续入口', async () => {
  const lastRead = { kind: 'timeline', id: 'e1581' };

  try {

await test('研读线索：开始写入失败不显示假保存', async () => {

await test('研读线索：检索只标记能补当前线索且尚未点亮的材料', async () => {
  const progress = researchFixture('yitiaobian', ['event:e1581']);
  const t = await setup('search', { progress });
  try {
    const material = { id: 'zhangjuzheng/c4', figure: 'zhangjuzheng', title: '一条鞭法', text: '赋役合并', source: '测试出处', kind: '现代转述', locator: '', edition: '', verification: '' };
    const unrelated = { id: 'chongzhen/c1', figure: 'chongzhen', title: '铜钱', text: '一条鞭法时期的铜钱', source: '测试出处', kind: '现代转述', locator: '', edition: '', verification: '' };
    t.requests[0].resolve({ sources: [material, unrelated] });
    await tick();
    const input = t.d.querySelector('.sr-input');
    input.value = '一条鞭法';
    t.d.querySelector('.sr-form').dispatchEvent(new t.w.Event('submit', { bubbles: true, cancelable: true }));
    await tick();
    const card = Array.from(t.d.querySelectorAll('.sr-card')).find(n => n.textContent.includes('一条鞭法'));
    const unrelatedCard = Array.from(t.d.querySelectorAll('.sr-card')).find(n => n.textContent.includes('铜钱'));
    assert(card && card.querySelector('.research-marker'), '可补槽材料缺少标记');
    assert(unrelatedCard && !unrelatedCard.querySelector('.research-marker'), '无关材料出现标记或未进入结果');
  } finally { t.close(); }
  const filled = await setup('search', { progress: researchFixture('yitiaobian', ['event:e1581', 'card:i3']) });
  try {
    filled.requests[0].resolve({ sources: [{ id: 'zhangjuzheng/c4', figure: 'zhangjuzheng', title: '一条鞭法', text: '赋役合并', source: '测试出处', kind: '现代转述', locator: '', edition: '', verification: '' }] });
    await tick();
    filled.d.querySelector('.sr-input').value = '一条鞭法';
    filled.d.querySelector('.sr-form').dispatchEvent(new filled.w.Event('submit', { bubbles: true, cancelable: true }));
    await tick();
    assert(!filled.d.querySelector('.research-marker'), '已点亮槽仍出现补全标记');
  } finally { filled.close(); }
});
